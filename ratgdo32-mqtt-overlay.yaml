# Merge this package into the current ratgdo32 dry-contact encoder firmware.
# ESPHome secrets.yaml must provide mqtt_broker and, if used, credentials.
# Replace the package path with the board file matching your hardware.
substitutions:
  name: ratgdo32-garage

packages:
  ratgdo: github://ratgdo/esphome-ratgdo/v32board_drycontact_enc.yaml@main

esphome:
  name: ${name}
  name_add_mac_suffix: false

# The native API is not required by the Hubitat driver. Keeping it is harmless;
# remove it only if you deliberately want an MQTT-only firmware.
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${name}
  discovery: false
  birth_message:
    topic: ${name}/status
    payload: online
    retain: true
  will_message:
    topic: ${name}/status
    payload: offline
    retain: true
  shutdown_message:
    topic: ${name}/status
    payload: offline
    retain: true
